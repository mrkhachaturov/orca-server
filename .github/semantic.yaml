###############################################################################
# This file configures "Semantic Pull Requests", which is documented here:
# https://github.com/zeke/semantic-pull-requests
###############################################################################

# Scopes are optionally supplied after a 'type'. For example, in
#
# feat(patches): bridge usage analytics
#
# '(patches)' is the scope. Scopes signify where the change occurred.
scopes:
  # patches: a change to the patch series itself.
  - patches

  # orca: a move of the pinned lib/orca submodule.
  - orca

  # build: the Dockerfile, docker-bake, or the build scripts.
  - build

  # docs: changes to the documentation.
  - docs

  # ci: workflows and the scripts under ci/.
  - ci

# We only check that the PR title is semantic. The title is what lands in main,
# because squash merges take the PR title as the commit subject.
titleOnly: true

types:
  # A build of any kind.
  - build

  # A user-facing change that corrects a defect.
  - fix

  # Any task ignored for changelog purposes.
  - chore

  # Any work performed on CI.
  - ci

  # Work that implements or supports a feature.
  - feat

  # A refactor changes structure without any behavioral change.
  - refactor

  # A git revert for any style of commit.
  - revert

  # Adding tests of any kind. Separate from feature or fix implementations.
  - test

  # A new release.
  - release
