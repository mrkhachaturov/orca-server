name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Orca tag to release, e.g. v1.4.156"
        type: string
        required: true
      patch:
        description: "Our patch number. Bump it to re-release the same Orca tag."
        type: string
        required: false
        default: "0"
  # Safe only while the checkout below takes the base branch: adding a `ref:`
  # there would build the head of an untrusted PR.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: ${{ matrix.platform }}
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'update/'))

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    # A native runner per architecture; nothing here emulates.
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    # Env vars, never `${{ }}` inside a run block — an input expanded into a
    # script can close the quote and run.
    env:
      TAG: ${{ inputs.version || github.event.pull_request.head.ref || github.ref_name }}
      PATCH: ${{ inputs.patch || '0' }}

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Names this leg's artifact — upload-artifact rejects a name already
      # claimed in the run.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: target
        with:
          script: |
            core.setOutput('arch', '${{ matrix.platform }}'.split('/').pop());

      - name: Strip update/ and v from the tag
        id: orca
        run: |
          version=${TAG#update/}
          echo "tag=v${version#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # quilt is in neither the mise registry nor the pkgx pantry; apt is the
      # only source for it.
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: quilt
          version: 1.0

      # Before anything that sources .mise/lib.sh — it shells out to jq.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # Version comes from package.json, not `git describe`: actions/checkout
      # fetches submodules shallow and without tags.
      - name: Check the submodule is on the version being released
        env:
          ORCA_TAG: ${{ steps.orca.outputs.tag }}
        run: |
          source ./.mise/lib.sh
          pinned="v$(orca_version)"
          if [[ "$pinned" != "$ORCA_TAG" ]] ; then
            echo "lib/orca is on $pinned but the release says $ORCA_TAG"
            exit 1
          fi

      - name: Set our version
        id: version
        run: |
          source ./.mise/lib.sh
          echo "version=$(orca_server_version "$PATCH")" >> "$GITHUB_OUTPUT"

      # No `quilt push -a` ahead of these two: test:series pops and pushes the
      # series itself, and the build task applies it itself.
      - run: mise run test:series

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # No platform argument: the task defaults to the host, which is already
      # the runner the matrix chose.
      - run: mise run build "$PATCH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-${{ steps.target.outputs.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    name: Draft the release
    runs-on: ubuntu-latest
    needs: appimage

    permissions:
      contents: write
      discussions: write # discussion_category_name below

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: appimage-*
          merge-multiple: true
          path: dist

      # Everything between "## Unreleased" and the next "## ", trailing blank
      # lines stripped.
      - run: |
          mkdir -p .cache
          awk '/^## Unreleased/ {f=1; next} /^## / {f=0} f' CHANGELOG.md \
            | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' > .cache/release-notes
          cat .cache/release-notes

      # Not `gh`: `gh release create --draft --discussion-category` errors with
      # "discussions for draft releases not supported".
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          draft: true
          discussion_category_name: "Announcements"
          files: dist/*.AppImage
          tag_name: v${{ needs.appimage.outputs.version }}
          name: v${{ needs.appimage.outputs.version }}
          body_path: .cache/release-notes
