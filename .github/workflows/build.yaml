name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # A job block replaces the workflow's, so contents is repeated.
    permissions:
      contents: read # actions/checkout
      pull-requests: read # paths-filter reads the PR file list over the API
    outputs:
      artifact: ${{ steps.filter.outputs.artifact }}
      image: ${{ steps.filter.outputs.image }}
      series: ${{ steps.filter.outputs.series }}
      tests: ${{ steps.filter.outputs.tests }}
      e2e: ${{ steps.filter.outputs.e2e }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        # Each list is what its job reads. `mise.toml` pins bats for series, jq
        # for the build and node for tests; `.node-version` is read by nothing
        # but `bump`.
        # No docs filter: the lint job below is deliberately unfiltered.
        with:
          filters: |
            artifact:
              - "lib/**"
              - "patches/**"
              - "src/**"
              - "build/**"
              - "Dockerfile"
              - ".dockerignore"
              - "docker-bake.hcl"
              - "mise.toml"
              - "mise.lock"
              - ".mise/lib.sh"
              - ".mise/tasks/build.sh"
              - ".mise/tasks/up.sh"
              - ".mise/tasks/overlay.sh"
            # The image definition: nothing but a build can check these, so they
            # are the one thing the push to main still builds.
            image:
              - "build/**"
              - "Dockerfile"
              - ".dockerignore"
              - "docker-bake.hcl"
              - ".mise/tasks/build.sh"
            series:
              - "lib/**"
              - "patches/**"
              - "src/**"
              - "test/**"
              - ".gitmodules"
              - "mise.toml"
              - "mise.lock"
              - ".mise/tasks/test/series.sh"
              - ".mise/tasks/overlay.sh"
            tests:
              - "lib/**"
              - "patches/**"
              - "src/**"
              - "mise.toml"
              - "mise.lock"
              - "kodus-config.yml"
              - ".kody/**"
              - ".mise/lib.sh"
              - ".mise/tasks/test/types.sh"
              - ".mise/tasks/test/unit.sh"
              - ".mise/tasks/test/scope.sh"
              - ".mise/tasks/kodus/config.sh"
              - ".mise/tasks/up.sh"
              - ".mise/tasks/overlay.sh"
            e2e:
              - ".mise/tasks/test/e2e.sh"
            # Only this file defines the jobs below; release.yaml and update.yaml
            # cannot reach them, and flint lints all three on every event.
            workflows:
              - ".github/workflows/build.yaml"
      # Which filters matched, in the log: a job that skipped is otherwise
      # indistinguishable from one whose filter never fired.
      - env:
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
        run: printf '%s\n' "$FILTERS"

  # Squash merges take the PR title as the commit subject, so it is the only
  # message that reaches main — and no git hook ever sees it. This is the same
  # commit-msg hook `hk.pkl` runs locally, so the two cannot drift.
  title:
    name: PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      # The title is attacker-controlled: it reaches the shell as an env var,
      # never as `${{ }}` inside the run block.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/pr-title"
          hk run commit-msg "$RUNNER_TEMP/pr-title"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # No filter and no submodule: flint's scope is every tracked file, so any
    # path list here would silently shrink it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      # Before lint: doctoc writes the markdown rumdl then checks.
      - run: mise run lint:docs
      - run: mise run lint

  series:
    name: Patch series integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      needs.changes.outputs.series == 'true'
      || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # quilt is in neither the mise registry nor the pkgx pantry; apt is the
      # only source for it.
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: quilt
          version: 1.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: mise run test:series

  tests:
    name: Acceptance tests
    runs-on: ubuntu-latest
    # test:scope alone runs 7-8 minutes; the rest of the job is under one.
    timeout-minutes: 30
    needs: [changes, series]
    # `!cancelled()` defeats the implicit success() gate, which would skip this
    # whenever `series` skips; both dependencies are then checked by name.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.series.result == 'success' || needs.series.result == 'skipped')
      && (needs.changes.outputs.tests == 'true'
      || needs.changes.outputs.workflows == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: quilt
          version: 1.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      # Before the install, or the lockfile resolves against upstream's
      # manifests instead of the ones the series produced.
      - run: mise run up
      # pnpm is deliberately not in mise.toml: lib/orca declares the version that
      # matters, and a newer one breaks the frozen lockfile. corepack installs it
      # into node's bin, which mise's shims do not know about until reshim.
      - name: Install Orca's toolchain
        run: |
          source ./.mise/lib.sh
          corepack enable
          corepack prepare "pnpm@$(orca_pnpm_version)" --activate
          mise reshim
          cd lib/orca && pnpm install --frozen-lockfile
      - run: mise run test:types
      - run: mise run test:unit
      - run: mise run test:scope
      # Here rather than in lint: it validates against the schema with ajv from
      # lib/orca's node_modules, which the install above provides.
      - run: mise run kodus:config

  build:
    name: Build the AppImage (${{ matrix.platform }})
    # 5-12 minutes in practice; the spread is Ubuntu's apt mirror.
    timeout-minutes: 45
    needs: [changes, series]
    # A squash lands the tree the pull request already built, so a push rebuilds
    # only what no other job can check. Guards as on `tests` above.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.series.result == 'success' || needs.series.result == 'skipped')
      && (github.event_name == 'pull_request'
      || needs.changes.outputs.image == 'true')
      && (needs.changes.outputs.artifact == 'true'
      || needs.changes.outputs.e2e == 'true'
      || needs.changes.outputs.workflows == 'true')
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    # A native runner per architecture; nothing here emulates.
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      # Names this leg's artifact — upload-artifact rejects a name already
      # claimed in the run.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: target
        with:
          script: |
            core.setOutput('arch', '${{ matrix.platform }}'.split('/').pop());

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: quilt
          version: 1.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # No platform argument: the task defaults to the host, which is already
      # the runner the matrix chose.
      - run: mise run build
      # The runtime list docs/install.md publishes; this job, release.yaml and
      # that doc must agree.
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # libasound2t64, not libasound2: noble's t64 transition left the old
          # name a virtual package with no candidate and two providers, so apt
          # cannot resolve it. Both runners are noble.
          packages: libgtk-3-0 libnss3 libgbm1 libasound2t64 libatk-bridge2.0-0 libatspi2.0-0 libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 libxss1 xvfb xauth dbus-x11
          version: 1.0
      - run: mise run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-${{ steps.target.outputs.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # The only required check. A matrix job that is skipped reports one check named
  # with the raw `${{ matrix.platform }}`, never the expanded legs, so requiring
  # those directly wedges any pull request the filters skip the build on.
  #
  # `changes` is in needs on purpose: without it, a failure there skips the rest
  # and skipped alone would read as green.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [changes, title, lint, series, tests, build]
    if: always()
    steps:
      # Every dependency's result, so a red required check names the culprit in
      # its own log.
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$RESULTS"
      - name: A job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
