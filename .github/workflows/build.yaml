name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for pull requests when developers push additional
# changes, and serialize builds in branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      series: ${{ steps.filter.outputs.series }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            ci:
              - ".github/**"
              - "ci/**"
              - "test/**"
            docs:
              - "docs/**"
              - "README.md"
              - "CHANGELOG.md"
            series:
              - "lib/**"
              - "patches/**"
              - "Dockerfile"
              - "docker-bake.hcl"
              - ".node-version"

  prettier:
    name: Run prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: prettier --check .

  doctoc:
    name: Doctoc markdown files
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      # Fails when a heading changed and the table of contents did not.
      - run: ./ci/dev/doctoc.sh

  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: ./ci/dev/lint-scripts.sh

  series:
    name: Patch series integrity
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.series == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      # The series is meaningless without the tree it applies to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: quilt
          version: 1.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      # Proves the committed patches are exactly what a clean push produces:
      # every entry resolves, nothing applies with fuzz, nothing is stale.
      - run: ./ci/dev/test-scripts.sh

  build:
    name: Build the AppImage
    runs-on: ubuntu-latest
    needs: [changes, series]
    # ci/ counts: ci/lib.sh and ci/build/ are the build. Keying only on series
    # let a change to the build scripts merge without ever being built.
    if: needs.changes.outputs.series == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: quilt
          version: 1.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # The build runs Orca's own typecheck, which is what actually validates
      # that the series still fits upstream.
      - run: ./ci/build/build-appimage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage
          path: dist/*.AppImage
          retention-days: 7
