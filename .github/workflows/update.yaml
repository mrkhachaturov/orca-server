name: Update Orca

# Moves the pinned submodule to a new upstream tag, restacks the series onto it,
# and opens a PR. It never merges: a bump means re-justifying every patch —
# keep, shrink, merge or drop — and `git apply` succeeding is not that
# judgement. A patch can apply cleanly and still be redundant, or already
# shipped upstream.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Orca tag to move to, e.g. v1.4.157"
        type: string
        required: true
  schedule:
    - cron: "0 6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ inputs.version }}

    steps:
      - name: Fetch latest tag
        if: env.TAG == ''
        run: |
          tag=$(curl -fsSLI -o /dev/null -w "%{url_effective}" https://github.com/stablyai/orca/releases/latest)
          tag="${tag#https://github.com/stablyai/orca/releases/tag/}"
          echo "TAG=$tag" >> $GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Check current version
        id: check
        run: |
          current="$(git -C lib/orca describe --tags --exact-match 2>/dev/null || echo none)"
          if [[ $current == "$TAG" ]] ; then
            echo "already pinned to $TAG"
            echo done=true >> $GITHUB_OUTPUT
          elif git ls-remote --exit-code --heads origin "update/$TAG" ; then
            echo "there is already a PR for updating to $TAG"
            echo done=true >> $GITHUB_OUTPUT
          else
            echo "$TAG update has not started yet (currently $current)"
            echo done=false >> $GITHUB_OUTPUT
          fi

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        if: steps.check.outputs.done == 'false'
        with:
          packages: quilt
          version: 1.0

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        if: steps.check.outputs.done == 'false'

      - name: Restack the series onto ${{ env.TAG }}
        if: steps.check.outputs.done == 'false'
        run: VERSION="$TAG" ./ci/build/update-orca.sh

      # The checklist update-orca.sh writes says which steps landed and which
      # need a human. It goes in the PR body so the reviewer starts from it.
      - name: Read the checklist
        if: steps.check.outputs.done == 'false'
        id: checklist
        run: |
          {
            echo 'body<<CHECKLIST_EOF'
            cat .cache/checklist
            echo CHECKLIST_EOF
          } >> $GITHUB_OUTPUT

      # A pull request opened with GITHUB_TOKEN does not start any workflow, so
      # the bump would arrive with no CI at all. An installation token from our
      # own App does start them, and it is minted per run and expires in an
      # hour, so there is nothing long-lived to leak or rotate.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.check.outputs.done == 'false'
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open PR
        if: steps.check.outputs.done == 'false'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/${{ env.TAG }}
          title: "chore(orca): update Orca to ${{ env.TAG }}"
          commit-message: "chore(orca): update Orca to ${{ env.TAG }}"
          delete-branch: true
          # Opens as a draft because the review is the work: every patch has to
          # be re-justified before this can merge.
          draft: true
          body: |
            Moves `lib/orca` to `${{ env.TAG }}` and restacks the patch series.

            ${{ steps.checklist.outputs.body }}

            A patch applying cleanly is not a reason to keep it. Before merging,
            decide for each one: keep, shrink, merge or drop — and say why in
            CHANGELOG.md. Check especially whether upstream has since shipped
            the thing a patch was carrying.
